site_name: DecisionAct
site_description: Decision-model-driven execution for structured agent workflows.
site_author: AnilKumarBorige
site_url: https://anil951.github.io/decisionact/
repo_name: GitHub
repo_url: https://github.com/Anil951/decisionact
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026 AnilKumarBorige. MIT License.

docs_dir: docs
site_dir: site
strict: true

theme:
  name: readthedocs
  locale: en
  highlightjs: false
  navigation_depth: 3
  collapse_navigation: false

nav:
  - Overview: README.md
  - Get started:
      - Quickstart: quickstart.md
      - Building agents: building-agents.md
  - Guides:
      - Memory and approval: memory-and-approval.md
      - Execution flow: execution-flow.md
  - API reference: api-reference.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
      pygments_style: friendly

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/copy-code.js
