[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionact"
version = "0.1.0"
description = "Build agents with typed decisions, Python tools, and predefined replies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AnilKumarBorige"}]
keywords = ["agents", "decision-models", "jev", "clef", "workflows"]
dependencies = ["httpx>=0.27,<1", "typesafe-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Anil951/decisionact"
Issues = "https://github.com/Anil951/decisionact/issues"

[project.optional-dependencies]
examples = ["python-dotenv>=1,<2"]

[tool.setuptools]
package-dir = {decisionact = "src"}
packages = [
    "decisionact",
    "decisionact.checkpoint",
    "decisionact.memory",
    "decisionact.middleware",
    "decisionact.models",
]
